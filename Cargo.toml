[package]
name = "zettelist"
version = "0.1.0"
edition = "2021"
description = "Zettelkasten on Omnigraph の書き込みと整理の道具"

[[bin]]
name = "zl"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.2.1"
unicode-width = "0.2"
# Ollama への平文 HTTP 用 (TLS なし)
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
assert_cmd = "2"
